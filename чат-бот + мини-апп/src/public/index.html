<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#D50032">
<title>Симулятор заводчанина</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Neucha&display=swap">
<style>
/* Mobile-first Telegram Mini App. One brand look on purpose (red / white / graphite), independent of the Telegram theme. */
:root{
  --red:#D50032; --red-dk:#AB2328; --ink:#26272B; --steel:#626262; --grey:#A2AAAD;
  --green:#84BD00; --paper:#FFFFFF; --wall:#EDEFF0; --line:#D5D9DB;
  --f-brand:"Montserrat","Proxima Nova",Arial,sans-serif;
  --f-hand:"Neucha","Comic Sans MS","Segoe Print",cursive;
  --top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
  --bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --sides-l: max(10px, var(--tg-safe-area-inset-left, env(safe-area-inset-left, 0px)));
  --sides-r: max(10px, var(--tg-safe-area-inset-right, env(safe-area-inset-right, 0px)));
  --vh: var(--tg-viewport-stable-height, 100dvh);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--wall);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{font:500 15px/1.45 var(--f-brand);overscroll-behavior:none}
button,input,select{font:inherit}

/* ---------- game shell: HUD + stage fill the stable viewport ---------- */
.app{height:var(--vh);display:flex;flex-direction:column;padding:var(--top) var(--sides-r) 0 var(--sides-l);overflow:hidden}
body.finale .app{height:auto;overflow:visible;padding-bottom:calc(var(--bottom) + 24px)}
.bar{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;padding:7px 10px;margin-top:8px;border:2px solid var(--ink);border-radius:4px;flex:0 0 auto}
.bar img{height:22px;filter:brightness(0) invert(1);display:block}
.hud{display:flex;gap:10px;align-items:center;margin-left:auto;font-weight:800;font-size:13px}
.hud .k{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hud .v{font-variant-numeric:tabular-nums}
.meter{display:block;margin-top:3px;width:64px;height:10px;border:2px solid #fff;border-radius:2px;position:relative;overflow:hidden;background:rgba(0,0,0,.2)}
.meter i{position:absolute;inset:0 auto 0 0;background:#fff;transition:width .4s}
.mute{background:transparent;border:2px solid #fff;color:#fff;font:800 11px var(--f-brand);padding:5px 7px;border-radius:3px;cursor:pointer;white-space:nowrap}
.stage{position:relative;flex:1 1 auto;min-height:0;margin:8px 0 calc(var(--bottom) + 8px);display:flex;align-items:center;justify-content:center}
canvas#cv{display:block;touch-action:none;border:3px solid var(--ink);border-radius:4px;background:#fff}

/* ---------- cards: bottom sheet over the stage ---------- */
#ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(38,39,43,.38);overflow-y:auto;overscroll-behavior:contain;padding:12px 0 0;border-radius:4px}
.card{background:var(--paper);border:3px solid var(--ink);box-shadow:0 -4px 0 var(--ink);width:100%;max-width:560px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;margin-top:auto;border-radius:14px 14px 4px 4px;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.card h1,.card h2{margin:0;font-weight:900;text-transform:uppercase;line-height:1.02;text-wrap:balance;color:var(--red)}
.card h1{font-size:clamp(30px,9vw,44px);letter-spacing:-.01em}
.card h2{font-size:clamp(21px,6vw,28px)}
.card p{margin:0}
.eyebrow{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.hand{font-family:var(--f-hand);font-size:20px;line-height:1.25}
.mikh{display:flex;gap:10px;align-items:flex-start}
.mikh svg{flex:0 0 52px;width:52px;height:52px}
.mikh .say{background:var(--wall);border:2px solid var(--ink);padding:7px 11px;border-radius:14px 14px 14px 2px;font-family:var(--f-hand);font-size:19px;line-height:1.25;min-width:0}
.facts{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:14px;margin:0}
.facts dt{font-weight:800;color:var(--steel);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;padding-top:2px}
.facts dd{margin:0;min-width:0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:900 15px var(--f-brand);text-transform:uppercase;letter-spacing:.04em;background:var(--red);color:#fff;border:3px solid var(--ink);padding:13px 18px;min-height:50px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);border-radius:3px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.light{background:#fff;color:var(--red)}
.btn:disabled{opacity:.55}
.in-tg .tg-mirrored{display:none!important}
.btn:focus-visible,.tile:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,.mini:focus-visible{outline:3px solid var(--green);outline-offset:2px}
input[type=text],input[type=email],input[type=tel],input[type=date],select{border:2px solid var(--ink);padding:11px 10px;border-radius:3px;width:100%;background:#fff;color:var(--ink);font-weight:600;font-size:16px;min-height:46px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:2px solid var(--ink);background:#fff;padding:10px 9px;font:700 13.5px var(--f-brand);cursor:pointer;text-align:left;min-height:62px;border-radius:3px;color:var(--ink)}
.tile[aria-pressed="true"]{background:var(--red);color:#fff}
.tile small{display:block;font-weight:500;opacity:.75;margin-top:3px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{border:2px solid var(--ink);background:#fff;padding:13px 12px;font:700 15px var(--f-brand);cursor:pointer;text-align:left;border-radius:3px;color:var(--ink);min-height:50px}
.opt.right{background:var(--green)}
.opt.wrong{background:var(--red);color:#fff}
.small{font-size:12.5px;color:var(--steel)}
.stamp{align-self:flex-start;border:3px solid var(--red);color:var(--red);font-weight:900;text-transform:uppercase;padding:4px 10px;transform:rotate(-4deg);letter-spacing:.06em}

/* ---------- finale: plain scrolling page ---------- */
#final{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.sheet{background:#fff;border:3px solid var(--ink);padding:18px 16px;display:flex;flex-direction:column;gap:12px;border-radius:4px}
.sheet h2{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(22px,6.4vw,30px);line-height:1.05;color:var(--red);text-wrap:balance}
.sheet h3{margin:0;font-weight:800;font-size:17px}
.sheet p{margin:0}
.hero-final{background:var(--red);color:#fff}
.hero-final .eyebrow{color:#fff;opacity:.85}
.hero-final h2{color:#fff;font-size:clamp(30px,9.5vw,46px)}
.hero-final .hand{font-size:21px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:clamp(22px,7vw,32px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.stats span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}
.jobs{display:flex;flex-direction:column;gap:10px}
.job{border:2px solid var(--ink);padding:13px;display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:3px}
.job.top{border-width:3px;box-shadow:4px 4px 0 var(--red)}
.job .match{font-weight:900;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.job h3{font-size:16px}
.job .pay{font-weight:800}
.job a{color:var(--red);font-weight:800;text-decoration:none;padding:4px 0}
.perks{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none;font-size:14px}
.perks li{padding-left:16px;position:relative}
.perks li::before{content:"";position:absolute;left:0;top:.5em;width:8px;height:8px;background:var(--red)}
.contacts{display:flex;flex-direction:column;gap:8px}
.copy{display:flex;gap:8px;align-items:center;justify-content:space-between;border:2px solid var(--ink);padding:6px 6px 6px 10px;font-weight:700;border-radius:3px}
.copy span{user-select:all;min-width:0;overflow-wrap:anywhere}
.copy button{font:800 11px var(--f-brand);text-transform:uppercase;border:0;background:var(--ink);color:#fff;padding:9px 10px;cursor:pointer;border-radius:2px;flex:0 0 auto}
form#apply{display:flex;flex-direction:column;gap:12px}
form#apply label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13px}
form#apply .row{display:flex;gap:8px}
form#apply .row input{flex:1;min-width:0}
.mini{border:2px solid var(--ink);background:var(--wall);font:800 12px var(--f-brand);padding:0 10px;border-radius:3px;cursor:pointer;color:var(--ink);white-space:nowrap}
form#apply .chk{flex-direction:row;align-items:flex-start;gap:10px;font-weight:500;font-size:13.5px}
form#apply .chk input{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--red)}
.msg{font-weight:700;padding:10px 12px;border:2px solid var(--ink);border-radius:3px}
.msg.ok{background:var(--green)}
.msg.err{background:#fff;border-color:var(--red);color:var(--red-dk)}
pre.mail{white-space:pre-wrap;background:var(--wall);border:2px dashed var(--steel);padding:10px;font:500 13px/1.4 ui-monospace,Consolas,monospace;margin:0;overflow-x:auto}
ol.board{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;counter-reset:b}
ol.board li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);counter-increment:b;font-variant-numeric:tabular-nums;font-size:14px}
ol.board li::before{content:counter(b);font-weight:900;color:var(--red)}
ol.board li.me{background:var(--wall);font-weight:800}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <img id="logo" alt="Очаково">
    <div class="hud">
      <div><span class="k">Смена</span><span class="v" id="hClock">08:00</span></div>
      <div><span class="k">Терпение</span><span class="meter" aria-hidden="true"><i id="hPat" style="width:100%"></i></span></div>
      <div><span class="k">Премия</span><span class="v" id="hBonus">0 ₽</span></div>
      <button class="mute" id="mute" type="button" aria-pressed="false">Звук вкл</button>
    </div>
  </header>
  <section class="stage" id="stage">
    <canvas id="cv" width="540" height="960" aria-label="Игровое поле"></canvas>
    <div id="ov" hidden></div>
  </section>
  <section id="final" hidden></section>
</div>

// ================= TELEGRAM MINI APP LAYER =================
// Everything here degrades gracefully: outside Telegram the game runs as a plain mobile web page.
const CONFIG = {
  apiBase: '',                                   // same origin as server.js; set a full URL if the API lives elsewhere
  shareUrl: 'https://t.me/Ochakovo_hackathon_bot/play',  // direct link to the Mini App (BotFather → /newapp), used for "Позвать друга"
  hrEmail: 'rabota@ochakovo.ru'
};
const TG = (window.Telegram && window.Telegram.WebApp) || null;
const inTG = !!(TG && TG.initData);
const tgv = v => { try { return inTG && TG.isVersionAtLeast(v); } catch (e) { return false; } };

function hap(kind){
  if (!tgv('6.1') || !TG.HapticFeedback) return;
  try {
    if (kind === 'success' || kind === 'error' || kind === 'warning') TG.HapticFeedback.notificationOccurred(kind);
    else if (kind === 'select') TG.HapticFeedback.selectionChanged();
    else TG.HapticFeedback.impactOccurred(kind || 'light');
  } catch (e) {}
}

function tgInit(){
  document.documentElement.classList.toggle('in-tg', inTG);
  if (!inTG) return;
  try { TG.ready(); TG.expand(); } catch (e) {}
  const safe = fn => { try { fn(); } catch (e) {} };
  if (tgv('6.9')){ safe(() => TG.setHeaderColor('#D50032')); safe(() => TG.setBackgroundColor('#EDEFF0')); }
  if (tgv('7.10')) safe(() => TG.setBottomBarColor('#FFFFFF'));
  if (tgv('7.7')) safe(() => TG.disableVerticalSwipes());   // otherwise drags in the climb level close the app
  if (tgv('8.0')) safe(() => TG.lockOrientation());
}

function tgUserName(){
  try { const u = TG.initDataUnsafe.user; return [u.first_name, u.last_name].filter(Boolean).join(' ').slice(0, 24); } catch (e) { return ''; }
}

// ---- native bottom button, mirrored from the primary button of the current card ----
let mainHandler = null;
function mainOff(){
  if (!inTG || !TG.MainButton) return;
  try { if (mainHandler) TG.MainButton.offClick(mainHandler); TG.MainButton.hide(); } catch (e) {}
  mainHandler = null;
}
function mainFor(btn){
  mainOff();
  if (!inTG || !TG.MainButton || !btn) return;
  btn.classList.add('tg-mirrored');
  mainHandler = () => { mainOff(); btn.click(); };
  try {
    const p = { text: btn.textContent.trim(), color: '#D50032', text_color: '#FFFFFF', is_active: true, is_visible: true };
    if (tgv('7.10')) p.has_shine_effect = true;
    TG.MainButton.setParams(p); TG.MainButton.onClick(mainHandler);
  } catch (e) {}
}
function mainAction(text, fn){
  mainOff();
  if (!inTG || !TG.MainButton) return false;
  mainHandler = fn;
  try { TG.MainButton.setParams({ text, color: '#D50032', text_color: '#FFFFFF', is_active: true, is_visible: true }); TG.MainButton.onClick(mainHandler); } catch (e) { return false; }
  return true;
}
function closingGuard(on){ if (!inTG) return; try { on ? TG.enableClosingConfirmation() : TG.disableClosingConfirmation(); } catch (e) {} }

// ---- links: keep the user inside Telegram ----
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="http"]');
  if (!a || !inTG) return;
  e.preventDefault();
  const url = a.href;
  try { if (/^https:\/\/t\.me\//.test(url)) TG.openTelegramLink(url); else TG.openLink(url); } catch (err) { window.open(url, '_blank'); }
});

function shareResult(text){
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(CONFIG.shareUrl) + '&text=' + encodeURIComponent(text);
  if (inTG){ try { TG.openTelegramLink(url); return; } catch (e) {} }
  window.open(url, '_blank', 'noopener');
}

function askPhone(){
  return new Promise(res => {
    if (!tgv('6.9')) return res(null);
    try {
      TG.requestContact((ok, r) => {
        const ph = ok && r && r.responseUnsafe && r.responseUnsafe.contact && r.responseUnsafe.contact.phone_number;
        res(ph ? (String(ph).startsWith('+') ? ph : '+' + ph) : null);
      });
    } catch (e) { res(null); }
  });
}

async function api(path, body){
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Init-Data': inTG ? TG.initData : '' }, body: JSON.stringify(body) }
                   : { headers: { 'X-Init-Data': inTG ? TG.initData : '' } };
  const r = await fetch(CONFIG.apiBase + path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status, body: j });
  return j;
}
tgInit();

// ================= CORE =================
const W = 540, H = 960;
const C = { red:'#D50032', dred:'#AB2328', ink:'#26272B', steel:'#626262', grey:'#A2AAAD', green:'#84BD00',
  paper:'#FFFFFF', wall:'#EDEFF0', tile:'#DDE2E4', floor:'#B9C0C3', kvas:'#6B3410', skin:'#F2C9A0', wood:'#C08A55', sack:'#E9DFC8' };
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const ov = document.getElementById('ov');
const stageEl = document.getElementById('stage');
document.getElementById('logo').src = ICONS.logo;

// Canvas keeps a 9:16 logical field and is letterboxed into whatever space the stage has.
function fit(){
  const box = stageEl.getBoundingClientRect(); if (!box.width || !box.height) return;
  const s = Math.min(box.width / W, box.height / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  if (cv.style.width !== cw + 'px'){ cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; }
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const w = Math.round(cw * dpr), h = Math.round(ch * dpr);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
}
window.addEventListener('resize', fit);

// ---------- icons tinted ----------
const iconImg = {}; const tintCache = {};
for (const k in ICONS){ const im = new Image(); im.src = ICONS[k]; iconImg[k] = im; }
function icon(k, color){
  const key = k + color; if (tintCache[key]) return tintCache[key];
  const im = iconImg[k]; if (!im.complete || !im.naturalWidth) return null;
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return (tintCache[key] = c);
}
function drawIcon(k, x, y, s, color = C.red){ const c = icon(k, color); if (c) ctx.drawImage(c, x - s/2, y - s/2, s, s * c.height / c.width); }

// ---------- input ----------
const input = { x: W/2, y: H/2, down: false };
function toLogical(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => { audioInit(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const p = toLogical(e); input.x = p.x; input.y = p.y; input.down = true; if (speech && speech.t > .6) speech = null; scene && scene.down && scene.down(p.x, p.y); e.preventDefault(); });

let AC = null, muted = false;

function beep(f = 440, d = .1, type = 'square', vol = .07, slide = 0){
  if (!AC || muted) return; const t = AC.currentTime; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d = .3, vol = .15, freq = 800){
  if (!AC || muted) return; const t = AC.currentTime; const n = Math.floor(AC.sampleRate * d); const b = AC.createBuffer(1, n, AC.sampleRate);
  const a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random()*2 - 1) * (1 - i/n);

}

const floaters = [], parts = []; let shakeT = 0;

function burst(x, y, n, colors, sp = 300, g = 900, r = [3, 7]){ for (let i = 0; i < n; i++){ const a = rnd(0, Math.PI*2), v = rnd(sp*.3, sp); parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - sp*.3, g, t: 0, life: rnd(.5, 1.2), c: pick(colors), r: rnd(r[0], r[1]) }); } }

function updateFx(dt){
  for (let i = floaters.length - 1; i >= 0; i--){ const f = floaters[i]; f.t += dt; f.y -= 40*dt; if (f.t > 1.2) floaters.splice(i, 1); }

  shakeT = Math.max(0, shakeT - dt);
}

  for (const p of parts){ ctx.globalAlpha = clamp(1 - p.t/p.life, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r/2, p.y - p.r/2, p.r, p.r); }

// ================= LEVEL: СКЛАД (stacking) =================
class StackScene extends Scene {
  init(){
    this.BH = 40; this.goal = 12; this.placed = 0; this.misses = 0; this.perfects = 0;
    this.stack = [{ x: 160, w: 220, y: 820 - 40, c: 0 }];
    this.cam = 0; this.debris = []; this.widthSum = 0; this.wrap = -1;
    this.spawn(220);
    say('Паллет — это святое. Ставь ровно, а то развалится и будешь собирать до ночной смены.', 4);
  }
  topY(){ return this.stack[this.stack.length - 1].y; }
  spawn(w){ this.cur = { x: Math.random() < .5 ? 24 : 516 - w, w, y: this.topY() - 190, vy: 0, dir: Math.random() < .5 ? 1 : -1, falling: false, c: this.placed + 1 }; if (this.cur.x < 60) this.cur.dir = 1; else this.cur.dir = -1; }
  down(){
    if (!this.cur || this.wrap >= 0 || this.cur.falling) return;
    this.cur.falling = true; SFX.click();
  }
  land(){
    const b = this.cur, top = this.stack[this.stack.length - 1];
    const ov = Math.min(b.x + b.w, top.x + top.w) - Math.max(b.x, top.x);
    const sy = b.y - this.cam;
    if (ov <= 6){
      this.debris.push({ x: b.x, y: b.y, w: b.w, h: this.BH, vx: (b.x < top.x ? -120 : 120), vy: -80, rot: 0, vr: (b.x < top.x ? -3 : 3), c: b.c });
      this.misses++; SFX.bad(); hurt(7, b.x + b.w/2, sy - 20);
      say(pick(['Мимо! Это ж квас, а не баскетбол.', 'Упаковка на полу — минус премия.', 'Кладовщик плачет, бухгалтерия считает.']), 2.6, 'angry');
      if (this.misses >= 3) return this.end();
      this.spawn(b.w); return;
    }
    let nx = b.x, nw = b.w;
    if (Math.abs(b.x - top.x) < 8){ nx = top.x; nw = Math.min(b.w, top.w); this.perfects++; SFX.ok(); addFloat(nx + nw/2, sy - 30, 'Идеально!', C.green, 28); G.bonus += 100; hud(); }
    else {
      SFX.thud();
      if (b.x < top.x){ this.debris.push({ x: b.x, y: b.y, w: top.x - b.x, h: this.BH, vx: -100, vy: -60, rot: 0, vr: -4, c: b.c }); nx = top.x; nw = ov; }
      else { this.debris.push({ x: top.x + top.w, y: b.y, w: b.x + b.w - (top.x + top.w), h: this.BH, vx: 100, vy: -60, rot: 0, vr: 4, c: b.c }); nw = ov; }
      if (nw < 60) say('Коробка всё уже… скоро будешь грузить по одной банке.', 2.4);
    }
    this.stack.push({ x: nx, w: nw, y: top.y - this.BH, c: b.c });
    this.placed++; this.widthSum += nw / 220;
    if (this.placed >= this.goal) return this.end();
    this.spawn(nw);
  }
  end(){ this.wrap = 0; this.cur = null; say(this.placed >= this.goal ? 'Обматываем стрейч-плёнкой — и на отгрузку. Ты рождён для склада!' : 'Паллет развалился. Ладно, водитель фуры подождёт…', 3, this.placed >= this.goal ? 'ok' : 'angry'); }
  update(dt){
    const targetCam = Math.min(0, this.topY() - 560); this.cam += (targetCam - this.cam) * Math.min(1, dt * 4);

      if (!b.falling){ const sp = 190 + this.placed * 22; b.x += b.dir * sp * dt; if (b.x < 14){ b.x = 14; b.dir = 1; } if (b.x + b.w > 526){ b.x = 526 - b.w; b.dir = -1; } }
      else { b.vy += 2200 * dt; b.y += b.vy * dt; if (b.y >= this.topY() - this.BH){ b.y = this.topY() - this.BH; this.land(); } }
    }

// ================= LEVEL: РОЗЛИВ =================
class BottlingScene extends Scene {
  init(){
    this.items = []; this.spawnT = .6; this.dur = 42; this.caught = 0; this.missed = 0; this.wrong = 0; this.good = 0; this.belt = 0;
    this.jam = null; this.jamDone = false;
    say('Линия розлива — сердце завода. Брак — в сторону, нормальные — в упаковку. Не тормози, она не ждёт.', 4);
  }
  speed(){ return 150 + Math.min(this.t, this.dur) * 4.2; }
  // Path: top belt x 80→470 at y 470, elevator down at x 490 to y 740, bottom belt x 470→100 at y 740.
  pos(sd){ if (sd < 390) return { x: 80 + sd, y: 470 }; if (sd < 660) return { x: 490, y: 470 + (sd - 390) }; return { x: 490 - (sd - 660), y: 740 }; }
  spawn(){
    const kind = Math.random() < .5 ? 'pet' : 'can'; const r = Math.random(); let def = null, odd = null;
    if (r < .38){ def = kind === 'pet' ? pick(['cap', 'low', 'label']) : pick(['dent', 'label']); }
    else if (r < .46){ def = 'odd'; odd = pick(['sock', 'cucumber', 'thermos', 'cat']); }
    this.items.push({ sd: 0, x: 80, y: 470, kind, def, odd, st: 'line', vx: 0, vy: 0, rot: 0 });
  }
  down(x, y){
    if (this.jam){ if (hit(this.jamBtn, x, y)){ this.jam.n--; SFX.click(); shakeT = .1; if (this.jam.n <= 0){ this.jam = null; SFX.ok(); addFloat(270, 300, 'Линия пошла!', C.green); say('О, наладчик растёт! Запомни: сначала — стоп, потом — руками.', 2.8); } } return; }
    for (let i = this.items.length - 1; i >= 0; i--){
      const it = this.items[i]; if (it.st !== 'line') continue;
      if (x > it.x - 40 && x < it.x + 40 && y > it.y - 130 && y < it.y + 14){
        it.st = 'fly'; it.vx = rnd(-120, 120); it.vy = -520; SFX.pop();
        if (it.def){ this.caught++; G.bonus += 50; hud(); addFloat(it.x, it.y - 120, it.def === 'odd' ? 'Это что вообще?!' : 'Брак убран', C.green, 22); }
        else { this.wrong++; hurt(2, it.x, it.y - 120); if (Math.random() < .5) say('Это была нормальная бутылка! Её кто-то в магазине ждал.', 2.2, 'angry'); }
        return;
      }
    }
  }
  update(dt){
    if (this.t > 21 && !this.jamDone){ this.jamDone = true; this.jam = { n: 6 }; SFX.bad(); say('ЗАТОР! Этикетировщик зажевал этикетку. Жми «ПЕРЕЗАПУСК», быстро!', 3.5, 'angry'); }
    const sp = this.jam ? 0 : this.speed();
    this.belt += sp * dt;

// ================= LEVEL: ЛАБОРАТОРИЯ =================
class LabScene extends Scene {
  init(){
    this.n = 10; this.i = 0; this.right = 0; this.tLeft = 8; this.sipped = 0; this.feedback = null;
    this.samples = []; for (let k = 0; k < this.n; k++) this.samples.push(this.make(k === 6));
    say('Лаборатория. Сверяй пробу с эталоном: цвет, пена, газация, запах. Годен — в розлив, брак — назад технологам.', 4.5);
  }
  make(tea){
    if (tea) return { tea: true, color: 'hsl(35,80%,52%)', foam: 0, gas: false, smell: 'лимон и бергамот', bad: true, why: 'Это чай Михалыча, а не проба' };
    const s = { color: 'hsl(24,72%,27%)', foam: rnd(1.3, 2.7), gas: true, smell: pick(['хлебный', 'ржаной, хлебный', 'хлебный, с кислинкой']), bad: false };
    if (Math.random() < .55){
      const d = pick(['color', 'foam', 'gas', 'smell']); s.bad = true;
      if (d === 'color'){ const light = Math.random() < .5; s.color = light ? 'hsl(36,75%,52%)' : 'hsl(15,55%,11%)'; s.why = light ? 'Слишком светлый — не дотянули' : 'Слишком тёмный — перебор с колером'; }
      if (d === 'foam'){ s.foam = Math.random() < .5 ? 0 : rnd(4.5, 6); s.why = s.foam ? 'Пены как в стиральной машине' : 'Пены нет вообще'; }
      if (d === 'gas'){ s.gas = false; s.why = 'Выдохся: пузырьков нет'; }
      if (d === 'smell'){ s.smell = pick(['носками', 'бензином', 'духами «Шипр»', 'вчерашним борщом', 'мокрой собакой']); s.why = 'Запах явно не по рецептуре'; }
    }
    return s;
  }
  answer(isBad){
    const s = this.samples[this.i]; const ok = isBad === s.bad;
    if (ok){ this.right++; SFX.ok(); G.bonus += 60; hud(); this.feedback = { ok: true, text: s.bad ? 'Верно, брак: ' + s.why.toLowerCase() : 'Верно, годен к розливу' }; if (s.tea) say('Эй! Это мой чай! …Но вообще правильно, на линию его нельзя.', 3); }
    else { SFX.bad(); hurt(5, 270, 420); this.feedback = { ok: false, text: s.bad ? 'Пропустил брак: ' + s.why.toLowerCase() : 'Проба была нормальная!' }; }
    this.fbT = 1.2;
  }
  down(x, y){
    if (this.fbT > 0) return;
    if (hit(this.bGood, x, y)) return this.answer(false);
    if (hit(this.bBad, x, y)) return this.answer(true);
    if (x > 205 && x < 335 && y > 330 && y < 570){ this.sipped++; SFX.clink(); hurt(2, 270, 320); say(pick(['Это проба, а не обед! Сначала — по регламенту.', 'Не отпивай из колбы! У нас для дегустации своя комната.', 'Ещё раз отхлебнёшь — запишу в дегустационную комиссию. Без премии.']), 2.6, 'angry'); }
  }
  update(dt){
    if (this.fbT > 0){ this.fbT -= dt; if (this.fbT <= 0){ this.feedback = null; this.i++; this.tLeft = 8; if (this.i >= this.n) this.finish({ grade: this.right / this.n, line: `Верных заключений: ${this.right} из ${this.n}.` + (this.sipped ? ` Отхлебнул из пробы: ${this.sipped} раз(а).` : '') }); } return; }
    if (this.i >= this.n) return;
    this.tLeft -= dt; if (this.tLeft <= 0){ SFX.bad(); hurt(5, 270, 420); this.feedback = { ok: false, text: 'Время вышло, проба скисла' }; this.fbT = 1.2; }
  }
  glass(x, y, s, sc = 1){
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.beginPath(); wpoly([[-60, -230], [60, -230], [48, 0], [-48, 0]], 1); ctx.save(); ctx.clip();
    ctx.fillStyle = s.color; ctx.fillRect(-70, -180, 140, 190);
    const fh = s.foam * 14; ctx.fillStyle = '#F7EED9'; ctx.fillRect(-70, -180 - fh, 140, fh);
    if (s.gas){ ctx.fillStyle = 'rgba(255,255,255,.55)'; for (let k = 0; k < 12; k++){ const bx = Math.sin(k * 77.3) * 36, by = -((now * 60 + k * 37) % 170); ctx.beginPath(); ctx.arc(bx, by, 2.5, 0, 7); ctx.fill(); } }
    if (s.tea){ ctx.fillStyle = '#F2E266'; ctx.beginPath(); ctx.arc(20, -175, 18, 0, Math.PI); ctx.fill(); }
    ctx.restore(); ctx.beginPath(); wpoly([[-60, -230], [60, -230], [48, 0], [-48, 0]], 1); paint(null, C.ink, 4);
    ctx.restore();
  }
  draw(){
    drawWallBg('#F6F7F8');
    ctx.fillStyle = '#E4E8EA'; ctx.fillRect(0, 780, W, 180); wline(0, 780, W, 780, C.ink, 3);
    drawPanel(14, 120, 160, 270, 'ЭТАЛОН');
    this.glass(94, 372, { color: 'hsl(24,72%,27%)', foam: 2, gas: true }, .6);
    drawPanel(366, 120, 160, 270, 'НОРМА');
    [['Цвет', 'как эталон'], ['Пена', '1–3 см'], ['Газация', 'пузырьки'], ['Запах', 'хлебный']].forEach(([k, v], j) => { txt(k.toUpperCase(), 380, 168 + j*52, { size: 11, align: 'left', color: C.steel }); txt(v, 380, 190 + j*52, { size: 19, kind: 'h', align: 'left' }); });
    txt('игровой регламент', 446, 376, { size: 10, weight: 600, color: C.steel });
    if (this.i < this.n){
      const s = this.samples[this.i];
      this.glass(270, 570, s, .95);
      for (let k = 0; k <= 6; k++){ const yy = 570 - 171 - k * 13.3; wline(330, yy, 340, yy, C.steel, 2); if (k % 2 === 0) txt(k + '', 352, yy, { size: 11, color: C.steel }); }
      txt('см', 352, 570 - 171 - 6*13.3 - 15, { size: 11, color: C.steel });
      txt(`ПРОБА №${this.i + 1} из ${this.n}`, 270, 30, { size: 18, weight: 900, color: C.red });
      wrect(120, 52, 300, 12, '#fff', C.ink, 2); ctx.fillStyle = this.tLeft < 3 ? C.red : C.green; ctx.fillRect(122, 54, 296 * clamp(this.tLeft / 8, 0, 1), 8);
      wrect(24, 596, 492, 54, '#fff', C.ink, 2.5); txt('Нюхаешь… пахнет: ' + s.smell, 270, 623, { size: 22, kind: 'h' });
      this.bGood = button(24, 672, 236, 86, 'ГОДЕН', { fill: C.green, color: C.ink, size: 30 });
      this.bBad = button(280, 672, 236, 86, 'БРАК', { size: 30 });
    }
    if (this.feedback){ const ls = wrapText(this.feedback.text, 440, 24); wrect(30, 410, 480, 36 + ls.length * 28, this.feedback.ok ? C.green : '#fff', C.ink, 4); ls.forEach((l, j) => txt(l, 270, 440 + j * 28, { size: 24, kind: 'h', color: this.feedback.ok ? C.ink : C.red })); }
    drawWorker(70, 930, .85, this.feedback && !this.feedback.ok ? 'sad' : 'ok');
    txt(`Верно: ${this.right}`, 470, 900, { size: 22, weight: 900 });
  }
}

// ================= LEVEL: МАШИНИСТ (gauges) =================
class GaugeScene extends Scene {
  init(){
    this.dur = 36; this.green = 0; this.booms = 0;
    this.g = [['ПАР', 'бар'], ['CO₂', 'бар'], ['ХОЛОД', 'аммиак'], ['ВОДА', '°C']].map(([n, u], i) => ({ n, u, v: .5, d: rnd(.02, .08), next: rnd(.5, 2), danger: 0, low: 0, x: i % 2 ? 400 : 140, y: i < 2 ? 290 : 610 }));
    say('Пульт машиниста. Стрелки — в зелёной зоне. В красной долго не держи, а то… ну, ты понял.', 4);
  }
  down(x, y){
    for (const g of this.g){
      if (hit(g.bm, x, y)){ g.v = clamp(g.v - .13, 0, 1.05); SFX.hiss(); burst(g.x - 50, g.y + 130, 6, ['#fff', '#DDE'], 120, -200, [6, 12]); }
      if (hit(g.bp, x, y)){ g.v = clamp(g.v + .13, 0, 1.05); SFX.click(); }
    }
  }
  update(dt){
    if (this.t > this.dur){ if (!this.done){ const frac = this.green / (4 * this.dur); this.finish({ grade: clamp((frac - .25) / .6, 0, 1), line: `Стрелки в зелёной зоне ${Math.round(frac * 100)}% времени. Аварий: ${this.booms}.` }); } return; }
    const k = 1 + this.t / 22;
    for (const g of this.g){
      g.next -= dt; if (g.next <= 0){ g.next = rnd(.7, 2); g.d = (Math.random() < .68 ? rnd(.03, .12) : -rnd(.03, .09)) * k; }
      g.v = clamp(g.v + g.d * dt + Math.sin(now * 9 + g.x) * .002, 0, 1.05);
      if (g.v > .35 && g.v < .68) this.green += dt;
      if (g.v > .86){ g.danger += dt; if (g.danger > 1.3){ this.booms++; g.danger = 0; g.v = .5; shakeT = .5; SFX.boom(); burst(g.x, g.y, 50, ['#555', '#888', C.red, '#F4A259'], 500, 300, [6, 16]); addFloat(g.x, g.y - 50, 'БАБАХ!', C.red, 40); hurt(9, g.x, g.y - 90); say(pick(['Стрелку надо было сбросить! Хорошо, что это игра.', 'Вот поэтому машинист смотрит на приборы, а не в телефон.', 'Техника безопасности — не пустые слова. В жизни — только по инструкции!']), 3, 'angry'); } }
      else g.danger = Math.max(0, g.danger - dt);
      if (g.v < .12){ g.low += dt; if (g.low > 2.2){ g.low = 0; g.v = .4; SFX.bad(); hurt(4, g.x, g.y - 90); say('Давление упало — линия розлива встала. Операторы уже звонят.', 2.6, 'angry'); } } else g.low = 0;
    }
  }
  gauge(g){
    const cx = g.x, cy = g.y, r = 96;
    wcirc(cx, cy, r + 8, '#fff', C.ink, 4);
    const a0 = Math.PI * .8, a1 = Math.PI * 2.2; const A = v => a0 + (a1 - a0) * v;
    const arc = (v0, v1, col) => { ctx.beginPath(); ctx.arc(cx, cy, r - 12, A(v0), A(v1)); ctx.strokeStyle = col; ctx.lineWidth = 14; ctx.lineCap = 'butt'; ctx.stroke(); };
    arc(0, .12, '#F2B8C6'); arc(.35, .68, C.green); arc(.86, 1, C.red);
    for (let i = 0; i <= 10; i++){ const a = A(i / 10); wline(cx + Math.cos(a) * (r - 4), cy + Math.sin(a) * (r - 4), cx + Math.cos(a) * (r - 20), cy + Math.sin(a) * (r - 20), C.ink, 2); }
    const a = A(clamp(g.v, 0, 1)) + (g.v > .86 ? Math.sin(now * 50) * .05 : 0);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 18), cy + Math.sin(a) * (r - 18)); ctx.strokeStyle = C.red; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
    wcirc(cx, cy, 9, C.ink, null);
    txt(g.n, cx, cy + 42, { size: 18, weight: 900 }); txt(g.u, cx, cy + 62, { size: 12, weight: 700, color: C.steel });
    if (g.danger > .2){ ctx.globalAlpha = .5 + .5 * Math.sin(now * 20); txt('!!!', cx + 80, cy - 90, { size: 30, weight: 900, color: C.red }); ctx.globalAlpha = 1; }
    g.bm = button(cx - 104, cy + 112, 96, 66, '−', { size: 38, fill: '#fff', color: C.ink });
    g.bp = button(cx + 8, cy + 112, 96, 66, '+', { size: 38 });
    txt('сброс', cx - 56, cy + 196, { size: 11, color: C.steel }); txt('поддать', cx + 56, cy + 196, { size: 11, color: C.steel });
  }
  draw(){
    ctx.fillStyle = '#C9D0D3'; ctx.fillRect(0, 0, W, H);
    wrect(8, 168, 524, 660, '#B4BCC0', C.ink, 4);
    for (const g of this.g) this.gauge(g);
    ctx.fillStyle = C.floor; ctx.fillRect(0, 850, W, 110); wline(0, 850, W, 850, C.ink, 3);
    wrect(14, 14, 512, 64, '#fff', C.ink, 3);
    txt('ДО КОНЦА', 30, 32, { size: 11, align: 'left', color: C.steel }); txt(Math.max(0, Math.ceil(this.dur - this.t)) + ' с', 30, 57, { size: 24, weight: 900, align: 'left' });
    txt('АВАРИИ', 160, 32, { size: 11, align: 'left', color: C.steel }); txt(String(this.booms), 160, 57, { size: 24, weight: 900, align: 'left', color: C.red });
    txt('ПУЛЬТ', 380, 34, { size: 13, weight: 900, color: C.ink }); txt('МАШИНИСТА', 380, 56, { size: 13, weight: 900, color: C.ink });
    if (this.t < 6) txt('Держи все четыре стрелки в зелёном', W/2, 122, { size: 24, kind: 'h' });
    drawWorker(470, 950, .85, this.g.some(g => g.danger > .3) ? 'panic' : 'ok');
  }
}

    <h2>${esc(L.prof)}</h2>
    <dl class="facts"><dt>В жизни</dt><dd>${esc(L.real)}</dd><dt>В игре</dt><dd>${esc(L.you)}</dd><dt>Деньги</dt><dd>${esc(L.pay)}</dd></dl>
    ${mikhLine(L.mikh)}
    <div class="btns"><button class="btn" data-v="go" type="button">Погнали</button></div>`);
  await waitBtn(el); hidePanel();
}
function gradeWord(g){ return g >= .85 ? ['Огонь', 'Михалыч прослезился. Говорит, такого с восьмидесятого не видел.'] : g >= .6 ? ['Нормально', 'Работать можно. Ещё пару смен — и будешь учить новеньких.'] : g >= .35 ? ['Ну такое', 'Михалыч молча пьёт свой чай. Это плохой знак.'] : ['Позорище', 'Мастер уже ищет бланк. Но пока не нашёл.']; }
async function resultScreen(L, r){
  const g = clamp(r.grade || 0, 0, 1); G.res[L.id] = g;
  const dp = Math.round((g - .5) * 30); const prize = Math.round(g * 50) * 100;
  G.patience = clamp(G.patience + dp, 0, 100); G.bonus += prize; hud();
  const [w, m] = gradeWord(g);
  setScene(new IdleScene(g >= .5 ? 'ok' : 'sad'));
  const el = panel(`
    <div class="eyebrow">${esc(L.prof)} · итог</div>
    <h2>${w}</h2>
    <p>${esc(r.line || '')}</p>
    ${mikhLine(m, g < .35 ? 'angry' : 'ok')}
    <dl class="facts"><dt>Премия</dt><dd>+${prize.toLocaleString('ru-RU')} ₽</dd><dt>Терпение</dt><dd>${dp >= 0 ? '+' : ''}${dp}</dd><dt>А ты знал?</dt><dd>${esc(L.fact)}</dd></dl>
    <div class="btns"><button class="btn" data-v="go" type="button">Дальше по смене</button></div>`);
  await waitBtn(el);
}
async function firedScreen(L){
  setScene(new IdleScene('sad'));
  const el = panel(`
    <div class="eyebrow">Отдел кадров · ${esc(L.place)}</div>
    <h1>Вы уволены</h1>
    <p class="stamp">приказ №0 от сегодня</p>
    ${mikhLine('…Да шучу я. У студентов в «Очаково» нет испытательного срока, есть практика и наставник. Выдохни, попей кваску и давай заново.')}
    <div class="btns"><button class="btn" data-v="go" type="button">Попробовать ещё раз</button></div>`);
  await waitBtn(el); G.patience = 45; hud(); hidePanel();
}
async function quizScreen(){
  setClock('19:30');
  let score = 0;
  for (let i = 0; i < QUIZ.length; i++){
    const Q = QUIZ[i]; setScene(new IdleScene('ok'));
    const el = panel(`<div class="eyebrow">19:30 · Аттестация у наставника · вопрос ${i + 1} из ${QUIZ.length}</div><h2>${esc(Q.q)}</h2>
      <div class="opts">${Q.a.map((a, j) => `<button class="opt" type="button" data-v="${j}">${esc(a)}</button>`).join('')}</div><div id="qf"></div>`);
    const v = +(await waitBtn(el, '.opt'));
    el.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (j === Q.r) b.classList.add('right'); else if (j === v) b.classList.add('wrong'); });
    const ok = v === Q.r; if (ok){ score++; G.bonus += 300; SFX.ok(); } else { G.patience = clamp(G.patience - 5, 0, 100); SFX.bad(); } hud();
    el.querySelector('#qf').innerHTML = `${mikhLine((ok ? 'Верно! ' : 'Мимо. ') + Q.f, ok ? 'ok' : 'angry')}<div class="btns" style="margin-top:12px"><button class="btn" data-v="n" type="button">${i < QUIZ.length - 1 ? 'Следующий вопрос' : 'Закрыть смену'}</button></div>`;
    mainFor(el.querySelector('#qf .btn')); el.querySelector('#qf').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    await waitBtn(el.querySelector('#qf'));
  }
  G.quiz = score;
}

// ================= FINALE =================
function rankTitle(){ const avg = Object.values(G.res).reduce((a, b) => a + b, 0) / Math.max(1, Object.keys(G.res).length); return avg >= .8 ? 'Заводчанин года' : avg >= .6 ? 'Крепкий профессионал' : avg >= .4 ? 'Держится на мешалке' : 'Любимчик Михалыча (из жалости)'; }
const money = n => Number(n || 0).toLocaleString('ru-RU') + ' ₽';

async function finale(){
  setClock('20:00'); hidePanel(); closingGuard(false);
  document.body.classList.add('finale'); stageEl.hidden = true;
  const fin = document.getElementById('final'); fin.hidden = false;
  const order = LEVELS.map(L => L.id).sort((a, b) => (G.res[b] || 0) - (G.res[a] || 0));
  const title = rankTitle();
  const canContact = tgv('6.9');
  fin.innerHTML = `
    <section class="sheet hero-final">
      <div class="eyebrow">20:00 · Смена закрыта · ${esc(G.name)}</div>
      <h2>${esc(title)}</h2>
      <div class="stats">
        <div><b>${money(G.bonus)}</b><span>премия</span></div>
        <div><b>${Math.max(0, Math.round(G.patience))}%</b><span>терпение</span></div>
        <div><b>${G.quiz}/${QUIZ.length}</b><span>аттестация</span></div>
      </div>
      <p class="hand">Тебя не уволили. Михалыч говорит, что ты бы и по-настоящему справился. Вот что он советует.</p>
      <div class="btns"><button class="btn light" type="button" id="share">Позвать друга на смену</button></div>
    </section>
    <section class="sheet">
      <div class="eyebrow">Тебе подходит</div>
      <h2>Профессии по итогам смены</h2>
      <div class="jobs">${order.map((id, k) => { const J = JOBS[id]; const g = G.res[id] || 0; return `<article class="job ${k < 2 ? 'top' : ''}"><span class="match">${k === 0 ? 'Лучшее совпадение' : k === 1 ? 'Тоже твоё' : 'Совпадение'} · ${Math.round(g * 100)}%</span><h3>${esc(J.t)}</h3><p class="small">${esc(J.what)}</p><p class="pay">${esc(J.pay)}</p><a href="${HH(J.q)}" target="_blank" rel="noopener">Вакансии на hh.ru →</a></article>`; }).join('')}</div>
      <div class="btns"><a class="btn" href="https://hh.ru/employer/871" target="_blank" rel="noopener">Все вакансии на hh.ru</a><a class="btn ghost" href="https://ochakovo.ru/rabota/" target="_blank" rel="noopener">Карьера на ochakovo.ru</a></div>
    </section>
    <section class="sheet">
      <div class="eyebrow">Оплачиваемая практика для студентов</div>
      <h2>Что дают по-настоящему</h2>
      <p>Четыре подразделения: лаборатория, цех розлива, технологический цех и складской комплекс. С марта–апреля до июля–августа. С 18 лет, приоритет — 4-й курс и выпускники.</p>
      <ul class="perks">${PERKS.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      <h3>Отдел подбора</h3>
      <div class="contacts">
        <span class="copy"><span>rabota@ochakovo.ru</span><button type="button" data-copy="rabota@ochakovo.ru">Копировать</button></span>
        <span class="copy"><span>8 800 100-77-77, доб. 1155</span><button type="button" data-copy="88001007777">Копировать</button></span>
      </div>
      <p class="small">Офис: Москва, ул. Рябиновая, 44. Автобусы 275 и 610 от м. Кунцевская, от м. Озёрная — корпоративный автобус.</p>
    </section>
    <section class="sheet" id="applySheet">
      <div class="eyebrow">Анкета в отдел кадров</div>
      <h2>Хочу на практику</h2>
      <form id="apply" novalidate>
        <label for="fFio">ФИО<input id="fFio" type="text" required autocomplete="name" value="${esc(tgUserName())}"></label>
        <label for="fBirth">Дата рождения<input id="fBirth" type="date" required></label>
        <label for="fPhone">Телефон<span class="row"><input id="fPhone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="+7">${canContact ? '<button type="button" class="mini" id="fPhoneTg">Из Telegram</button>' : ''}</span></label>
        <label for="fMail">E-mail<input id="fMail" type="email" autocomplete="email" inputmode="email"></label>
        <label for="fUni">Вуз или колледж, курс<input id="fUni" type="text" required placeholder="МГУПП, 4 курс"></label>
        <label for="fJob">Интересует<select id="fJob">${order.map(id => `<option value="${esc(JOBS[id].t)}">${esc(JOBS[id].t)}</option>`).join('')}</select></label>
        <label for="fWhen">Готов выйти<select id="fWhen"><option>На практику этой весной–летом</option><option>Прямо сейчас</option><option>После выпуска</option><option>Пока присматриваюсь</option></select></label>
        <label class="chk" for="fOk"><input id="fOk" type="checkbox" required> <span>Согласен на обработку персональных данных для связи по вакансиям «Очаково»</span></label>
        <div class="btns"><button class="btn" type="submit" id="applyBtn">Отправить анкету</button></div>
        <div id="applyMsg" role="status"></div>
      </form>
    </section>
    <section class="sheet">
      <div class="eyebrow">Доска почёта</div>
      <h2>Лучшие смены</h2>
      <ol class="board" id="board"><li><span>Загружаем доску…</span><span></span></li></ol>
      <div class="btns"><button class="btn ghost" type="button" id="again">Сыграть ещё раз</button></div>
    </section>`;
  fin.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => { hap('select'); try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Скопировано'; } catch (e) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Выделено'; } }));
  fin.querySelector('#again').addEventListener('click', () => { location.reload(); });
  fin.querySelector('#share').addEventListener('click', () => { hap('light'); shareResult(`Отработал смену на заводе «Очаково»: «${title}», премия ${money(G.bonus)}. Спорим, ты не залезешь в варочный котёл быстрее?`); });
  const pt = fin.querySelector('#fPhoneTg'); if (pt) pt.addEventListener('click', async () => { const ph = await askPhone(); if (ph){ document.getElementById('fPhone').value = ph; hap('success'); } });
  fin.querySelector('#apply').addEventListener('submit', submitApply);
  // Native bottom button: first scrolls to the form, then submits it.
  const sheet = document.getElementById('applySheet');
  if (mainAction('Хочу на практику', () => sheet.scrollIntoView({ behavior: 'smooth', block: 'start' }))){
    fin.querySelector('#applyBtn').classList.add('tg-mirrored');
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && !G.applied){ mainAction('Отправить анкету', () => fin.querySelector('#apply').requestSubmit()); io.disconnect(); } }, { threshold: .25 });
    io.observe(sheet);
  }
  window.scrollTo({ top: 0 });
  SFX.fanfare();
  saveScore().then(loadBoard);
}

async function saveScore(){
  if (!inTG) return;
  try { await api('/api/score', { name: G.name, score: G.bonus, title: rankTitle() }); } catch (e) { /* board stays read-only */ }
}
async function loadBoard(){
  const ol = document.getElementById('board'); if (!ol) return;
  try {
    const j = await api('/api/top');
    if (!j.top || !j.top.length){ ol.innerHTML = `<li><span>Пока пусто. Стань первым!</span><span></span></li>`; return; }
    ol.innerHTML = j.top.map(v => `<li class="${v.me ? 'me' : ''}"><span>${esc(v.name || 'Аноним')} <span class="small">· ${esc(v.title || '')}</span></span><span>${money(v.score)}</span></li>`).join('');
  } catch (e) { ol.innerHTML = `<li><span>${inTG ? 'Доску сейчас не загрузить.' : 'Доска почёта работает внутри Telegram.'} Твой результат: ${money(G.bonus)}.</span><span></span></li>`; }
}
function age(d){ const b = new Date(d); if (isNaN(b)) return -1; const n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
async function submitApply(e){
  e.preventDefault();
  const f = id => document.getElementById(id); const msg = f('applyMsg');
  const data = { fio: f('fFio').value.trim(), birth: f('fBirth').value, phone: f('fPhone').value.trim(), email: f('fMail').value.trim(), study: f('fUni').value.trim(), job: f('fJob').value, when: f('fWhen').value };
  const err = t => { msg.innerHTML = `<div class="msg err">${t}</div>`; hap('error'); msg.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  if (!data.fio || !data.birth || !data.phone || !data.study) return err('Заполни ФИО, дату рождения, телефон и место учёбы.');
  if (!f('fOk').checked) return err('Отметь согласие на обработку данных, без него анкету не передать.');
  const a = age(data.birth); if (a >= 0 && a < 18) return err('«Очаково» берёт на работу и практику с 18 лет. Возвращайся, когда исполнится!');
  const letter = `Анкета из «Симулятора заводчанина»\nФИО: ${data.fio}\nДата рождения: ${data.birth}\nТелефон: ${data.phone}\nE-mail: ${data.email || '—'}\nУчёба: ${data.study}\nИнтересует: ${data.job}\nГотов выйти: ${data.when}\nРезультат в игре: ${rankTitle()}, ${G.bonus} ₽`;
  const fallback = reason => { msg.innerHTML = `<div class="msg err">${reason} Отправь этот текст на ${CONFIG.hrEmail} — в отделе подбора разберутся.</div><pre class="mail">${esc(letter)}</pre><div class="btns" style="margin-top:8px"><button class="btn ghost" type="button" id="cpL">Скопировать текст</button></div>`;
    document.getElementById('cpL').addEventListener('click', async ev => { try { await navigator.clipboard.writeText(letter); ev.target.textContent = 'Скопировано'; } catch (_) { const r = document.createRange(); r.selectNodeContents(msg.querySelector('pre')); getSelection().removeAllRanges(); getSelection().addRange(r); } }); };
  if (!inTG) return fallback('Анкета отправляется напрямую, только когда игра открыта в Telegram.');
  const btn = f('applyBtn'); btn.disabled = true; try { TG.MainButton.showProgress(); } catch (_) {}
  try {
    await api('/api/apply', { form: data, result: { title: rankTitle(), bonus: G.bonus, scores: G.res, quiz: G.quiz } });
    G.applied = true; mainOff(); btn.classList.remove('tg-mirrored'); btn.textContent = 'Отправить ещё раз'; hap('success');
    msg.innerHTML = '<div class="msg ok">Анкета у отдела подбора. С тобой свяжутся в Telegram или по телефону. Если нужно что-то поправить, отправь анкету ещё раз.</div>';
  } catch (er) { fallback(er.status === 422 ? (er.body.error || 'Проверь поля анкеты.') : 'Не получилось отправить анкету.'); }
  finally { btn.disabled = false; try { TG.MainButton.hideProgress(); } catch (_) {} }
}

// ================= MAIN =================
async function main(){
  hud();
  await titleScreen();
  closingGuard(true);
  await uniformScreen();
  for (let i = 0; i < LEVELS.length; i++){
    const L = LEVELS[i];
    await briefing(L, i);
    let r;
    for (;;){ r = await play(L.make()); speech = null; if (r && r.fired){ await firedScreen(L); continue; } break; }
    await resultScreen(L, r);
  }
  await quizScreen();
  await finale();
}
requestAnimationFrame(t => { last = t; frame(t); });
main();

</script>
</body>
</html>
