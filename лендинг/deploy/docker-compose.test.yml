# Separate file/project; never overlay the production file with -f twice.
name: ochakovo-candidates-test
services:
  db:
    extends: {file: docker-compose.yml, service: db}
    environment:
      POSTGRES_DB: ochakovo_candidates_test
  migrate:
    extends: {file: docker-compose.yml, service: migrate}
    environment:
      APP_ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://ochakovo:CHANGE_ME@db:5432/ochakovo_candidates_test}
      APP_ORIGIN: http://localhost:18121
  api:
    extends: {file: docker-compose.yml, service: api}
    environment:
      APP_ENV: test
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://ochakovo:CHANGE_ME@db:5432/ochakovo_candidates_test}
      APP_ORIGIN: http://localhost:18121
  web:
    extends: {file: docker-compose.yml, service: web}
    # !override prevents inherited production port from being merged.
    ports: !override ["127.0.0.1:18121:8080"]
    environment: {ENABLE_HSTS: '0'}
  maintenance:
    extends: {file: docker-compose.yml, service: maintenance}
    environment:
      APP_ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://ochakovo:CHANGE_ME@db:5432/ochakovo_candidates_test}
      PGDATABASE: ochakovo_candidates_test
    volumes: !override
      - ./maintenance:/opt/maintenance:ro
      - type: bind
        source: ./backups-test
        target: /backups
        bind: {create_host_path: false}
      - type: bind
        source: ${TEST_PGPASS_HOST_FILE:-./secrets/pgpass-test}
        target: /run/secrets/pgpass
        read_only: true
        bind: {create_host_path: false}
volumes:
  pgdata: {name: ochakovo-candidates_pgdata-test}
networks:
  internal: {internal: true}
  edge: {}
