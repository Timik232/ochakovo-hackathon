<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D50032">
<meta name="robots" content="noindex">
<title>Кандидаты · Очаково</title>
<link rel="icon" href="https://ochakovo.ru/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.wrap{max-width:1320px;margin:0 auto;padding:26px 16px 80px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head h1{font-size:clamp(30px,5vw,50px)}
.head .tools{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:0;margin-bottom:-3px;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none;padding-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:3px solid var(--ink);border-bottom:0;background:var(--light);font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;cursor:pointer;border-radius:var(--r) var(--r) 0 0;font-size:13px;white-space:nowrap;flex:0 0 auto}
.tabs button+button{margin-left:-3px}
.tabs button[aria-selected="true"]{background:#fff;padding-bottom:13px}
.tabs button[aria-selected="true"] .n{background:var(--red)}
.tabs button[data-tab="archive"]{margin-left:auto}
.tabs .n{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;margin-left:6px}
.board{background:#fff;border:3px solid var(--ink);border-radius:0 var(--r) var(--r) var(--r);box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:16px;border-bottom:3px solid var(--ink);align-items:center}
.filters input,.filters select{border:2px solid var(--ink);border-radius:var(--r);padding:9px 10px;font-weight:600;font-size:14px;background:#fff;min-width:0}
.filters .q{flex:1 1 240px}
.filters label.hotf{display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px;cursor:pointer}
.filters label.hotf input{width:18px;height:18px;accent-color:var(--red)}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--ink);color:#fff;font-weight:800}
.bulk select{border:2px solid #fff;background:var(--ink);color:#fff;border-radius:var(--r);padding:7px;font-weight:700}
.bulk .btn{box-shadow:none;border-color:#fff}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:2px solid var(--light);vertical-align:top;font-size:14px}
th{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#6b6d71;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--red)}
th .dir{color:var(--red)}
tr:hover td{background:#FFF6F8}
tr.sel td{background:#FFE6EC}
td.c{width:36px}td.c input,th.c input{width:18px;height:18px;accent-color:var(--red)}
.name{font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.name:hover{color:var(--red);text-decoration:underline}
.sub{display:block;color:#6b6d71;font-size:13px;font-weight:600}
.flame{color:var(--red);font-weight:900}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--ink);border-radius:99px;padding:1px 8px;margin:2px 4px 0 0;white-space:nowrap}
.tag.self{background:var(--light)}
.tag.staff{background:var(--ink);color:#fff}
.tag.dup{border-color:var(--amber);background:#FFF4D6}
.stage{border:2px solid var(--ink);border-radius:99px;padding:5px 8px;font-weight:800;font-size:12px;background:#fff;cursor:pointer}
.stage[data-s="new"]{background:var(--red);color:#fff}
.stage[data-s="interview"],.stage[data-s="offer"]{background:var(--amber)}
.stage[data-s="hired"]{background:var(--green);color:#fff}
.stage[data-s="reject"]{background:var(--grey)}
.rate{color:var(--amber);letter-spacing:1px;white-space:nowrap}
.rate s{color:#d4d5d7;text-decoration:none}
.row-act{display:flex;gap:6px;justify-content:flex-end}
.ib{border:2px solid var(--ink);border-radius:var(--r);background:#fff;color:var(--ink);width:34px;height:34px;cursor:pointer;display:grid;place-items:center;font-size:16px;padding:0}
.ib svg{width:18px;height:18px}
.tag.notes{cursor:pointer;background:#fff;font:inherit;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.tag.notes svg{width:13px;height:13px}
.tag.notes:hover{background:var(--ink);color:#fff}
.tag.cv{border-color:var(--red);color:var(--red);text-decoration:none}
.ib:hover{background:var(--light)}
.ib.del:hover{background:var(--red);color:#fff}
.empty{text-align:center;padding:60px 20px}
.empty .burst{max-width:360px;margin:0 auto 20px;min-height:200px}
.empty h3{font-size:28px}
.more{padding:14px;text-align:center}
/* карточка кандидата */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(43,43,46,.45)}
.drawer>section{width:min(560px,100%);height:100%;overflow:auto;background:#fff;border-left:4px solid var(--ink);padding:24px 24px 60px;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.drawer h2{font-size:28px;margin:4px 0 6px}
.drawer .x{position:absolute;right:18px;top:18px}
.drawer dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:18px 0;font-size:14px}
.drawer dt{font-weight:800;color:#6b6d71;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.drawer dd{margin:0;font-weight:600;white-space:pre-wrap;word-break:break-word}
.drawer .box{border:3px solid var(--ink);border-radius:var(--r);padding:16px;margin-top:18px;background:var(--light)}
.drawer .box h3{margin:0 0 12px;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.drawer .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:#c4c6c9;padding:0 2px}
.stars button.on{color:var(--amber)}
.note{border-left:4px solid var(--red);padding:6px 10px;margin:10px 0;background:#fff}
.note small{display:block;color:#6b6d71;font-weight:700;font-size:12px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(43,43,46,.5);padding:16px}
.modal>section{width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;position:relative}
.modal .x{position:absolute;right:14px;top:14px}
#qr{display:grid;place-items:center;background:#fff;padding:16px;border:3px solid var(--ink);margin:16px auto;width:max-content}
.qrlink{word-break:break-all;font-size:13px;font-weight:600}
.vlist{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.vlist label{display:flex;gap:10px;align-items:center;font-weight:700;border:2px solid var(--ink);border-radius:var(--r);padding:8px 10px}
.vlist input{width:18px;height:18px;accent-color:var(--red)}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none}#modal .x,#modal .btn,#modal .grid,#modal .muted{display:none}#modal section{box-shadow:none;border:0}#qr svg{width:9cm;height:9cm}}
@media (max-width:900px){
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr{position:relative;border-bottom:3px solid var(--light);padding:10px 12px 10px 44px}
  td{border:0;padding:3px 0}
  td.c{position:absolute;left:12px;top:14px}
  td.hide-m{display:none}
  .row-act{justify-content:flex-start;margin-top:6px}
  .drawer dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div><p class="kicker">База кандидатов</p><h1 class="comic">Кандидаты <span class="r">«Очаково»</span></h1></div>
    <div class="tools">
      <button class="btn white sm" id="qrBtn" type="button">QR для стенда</button>
      <button class="btn white sm" id="vacBtn" type="button">Вакансии</button>
      <a class="btn white sm" id="csv" href="api/staff/export.csv" download>Выгрузить CSV</a>
      <a class="btn sm" href="staff.html">+ Добавить</a>
    </div>
  </div>

  <div class="tabs" role="tablist">

  </div>
  <div class="board">
    <div class="filters">
      <input class="q" type="search" id="q" placeholder="Поиск: имя, телефон, вуз, комментарий" aria-label="Поиск">
      <select id="fVac" aria-label="Вакансия"><option value="">Все вакансии</option></select>
      <select id="fStage" aria-label="Этап"><option value="">Все этапы</option></select>
      <select id="fEvent" aria-label="Мероприятие"><option value="">Все мероприятия</option></select>
      <select id="fSource" aria-label="Кто заполнил"><option value="">Любой источник</option><option value="self">Заполнил сам</option><option value="staff">Внёс сотрудник</option></select>
      <select id="sort" aria-label="Сортировка">
        <option value="created_at:desc">Сначала новые</option><option value="created_at:asc">Сначала старые</option>
        <option value="full_name:asc">По имени А–Я</option><option value="rating:desc">По оценке</option>
        <option value="vacancy:asc">По вакансии</option><option value="stage:asc">По этапу</option><option value="event:asc">По мероприятию</option>
      </select>
    </div>
    <div class="bulk" id="bulk" hidden>
      <span id="selN"></span>
      <button class="btn sm ink" data-bulk="archive" id="bArc">В архив</button>
      <button class="btn sm ink" data-bulk="restore" id="bRes" hidden>Вернуть из архива</button>
      <select id="bStage" aria-label="Сменить этап"><option value="">Сменить этап…</option></select>
      <button class="btn sm" data-bulk="delete">Удалить</button>
      <button class="btn sm white" id="bClear" style="margin-left:auto">Снять выбор</button>
    </div>
    <table>
      <thead><tr>
        <th class="c"><input type="checkbox" id="all" aria-label="Выбрать все"></th>
        <th><button data-sort="full_name">Кандидат</button></th>
        <th><button data-sort="vacancy">Вакансия</button></th>
        <th><button data-sort="school">Учёба / опыт</button></th>
        <th><button data-sort="event">Откуда</button></th>
        <th><button data-sort="stage">Этап</button></th>
        <th><button data-sort="rating">Оценка</button></th>
        <th><button data-sort="created_at">Дата</button></th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="more" id="more" hidden><button class="btn white sm" type="button">Показать ещё</button></div>
  </div>
</main>

<div class="drawer" id="drawer" hidden><section role="dialog" aria-modal="true" aria-labelledby="dName"></section></div>
<div class="modal" id="modal" hidden><section class="card" role="dialog" aria-modal="true"></section></div>

<script src="qrcode.js"></script>
<script src="sample.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
<script src="staff.js"></script>
<script>
'use strict';
const S = { all: [], vacs: [], vacMap: {}, tab: 'active', sel: new Set(), limit: 100, ...store.get('ochakovo.listView', { sort: 'created_at:desc' }) };
const STAGE_ORDER = Object.fromEntries(STAGES.map(([k], i) => [k, i]));
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = { arc: svg('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>'),
  res: svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'), del: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
  note: svg('<path d="M4 5h16v11H9l-5 4z"/>') };
const isToday = c => new Date(c.created_at).toDateString() === new Date().toDateString();
const TABS = [
  ['active', 'Активные', c => !c.archived],
  ['work', 'В работе', c => !c.archived && ['review', 'interview', 'offer'].includes(c.stage)],
  ['today', 'Сегодня', c => !c.archived && isToday(c)],
  ['hot', 'Горячие', c => !c.archived && c.hot],
  ['interview', 'Собеседование', c => !c.archived && c.stage === 'interview'],
  ['hired', 'Приняты', c => !c.archived && c.stage === 'hired'],
  ['archive', 'Архив', c => !!c.archived]
];
const TAB_FN = Object.fromEntries(TABS.map(([k, , f]) => [k, f]));
$('.tabs').innerHTML = TABS.map(([k, t]) => `<button role="tab" aria-selected="${k === S.tab}" data-tab="${k}">${t}<span class="n" data-n="${k}">0</span></button>`).join('');

$('#fStage').insertAdjacentHTML('beforeend', STAGES.map(([v, t]) => `<option value="${v}">${t}</option>`).join(''));
$('#bStage').insertAdjacentHTML('beforeend', STAGES.map(([v, t]) => `<option value="${v}">${t}</option>`).join(''));
$('#sort').value = S.sort;

requireStaff('candidates').then(load);

async function load() {
  try {
    const [all, vacs] = await Promise.all([api('GET', '/api/staff/candidates'), api('GET', '/api/vacancies?all=1')]);
    S.all = all; S.vacs = vacs; S.vacMap = Object.fromEntries(vacs.map(v => [v.id, v]));
  } catch (e) { if (e.status === 401) return location.reload(); toast(e.message); }
  const keepVac = $('#fVac').value, keepEv = $('#fEvent').value;
  $('#fVac').innerHTML = '<option value="">Все вакансии</option>' + S.vacs.map(v => `<option value="${esc(v.id)}">${esc(v.title)}</option>`).join('');
  const events = [...new Set(S.all.map(c => c.event).filter(Boolean))].sort();
  $('#fEvent').innerHTML = '<option value="">Все мероприятия</option>' + events.map(e => `<option>${esc(e)}</option>`).join('');
  $('#fVac').value = keepVac; $('#fEvent').value = events.includes(keepEv) ? keepEv : '';
  render();
}

function stats() {
  for (const [k, , f] of TABS) $(`[data-n="${k}"]`).textContent = S.all.filter(f).length;
}

function filtered() {
  const q = $('#q').value.trim().toLowerCase(); const qd = q.replace(/\D/g, '');
  const fv = $('#fVac').value, fs = $('#fStage').value, fe = $('#fEvent').value, fsrc = $('#fSource').value; const inTab = TAB_FN[S.tab];
  const list = S.all.filter(c => inTab(c)
    && (!fv || c.vacancy_id === fv) && (!fs || c.stage === fs) && (!fe || c.event === fe) && (!fsrc || c.source === fsrc)
    && (!q || [c.full_name, c.email, c.telegram, c.school, c.specialty, c.comment, c.event, c.about, c.staff_name].join(' ').toLowerCase().includes(q)
         || (qd.length >= 3 && c.phone.replace(/\D/g, '').includes(qd))));
  const [key, dir] = S.sort.split(':'); const k = dir === 'desc' ? -1 : 1;
  const val = c => key === 'vacancy' ? (S.vacMap[c.vacancy_id]?.title || 'яяя') : key === 'stage' ? STAGE_ORDER[c.stage] : key === 'school' ? (c.school || 'яяя') : c[key] ?? '';
  return list.sort((a, b) => { const x = val(a), y = val(b);
    const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'ru');
    return r * k || (b.created_at > a.created_at ? 1 : -1); });
}

function row(c) {
  const v = S.vacMap[c.vacancy_id];
  return `<tr data-id="${c.id}" class="${S.sel.has(c.id) ? 'sel' : ''}">
    <td class="c"><input type="checkbox" ${S.sel.has(c.id) ? 'checked' : ''} aria-label="Выбрать"></td>
    <td><button class="name" data-open>${c.hot ? '<span class="flame" title="Горячий">🔥 </span>' : ''}${esc(c.full_name)}</button>
      <span class="sub">${esc(c.phone)}${c.telegram ? ' · ' + esc(c.telegram) : ''}</span>
      ${c.dupes ? `<span class="tag dup" title="Этот телефон встречается в базе ещё ${c.dupes} раз">повтор</span>` : ''}${c.notes_count ? `<button type="button" class="tag notes" data-open="notes" title="Открыть комментарии">${ICON.note} ${c.notes_count}</button>` : ''}${c.resume_url ? `<a class="tag cv" href="${esc(c.resume_url)}" target="_blank" rel="noopener">резюме</a>` : ''}</td>
    <td>${v ? esc(v.title) : '<span class="muted">не выбрана</span>'}${c.employment ? `<span class="sub">${esc(c.employment)}</span>` : ''}</td>
    <td class="hide-m">${esc(c.who || '—')}<span class="sub">${esc([c.school, c.grad_year && 'выпуск ' + c.grad_year, !c.grad_year && c.edu_level].filter(Boolean).join(', '))}</span></td>
    <td><span class="tag ${c.source}">${c.source === 'self' ? 'сам' : 'сотрудник'}</span><span class="sub">${esc(c.event || '—')}</span></td>
    <td><select class="stage" data-s="${c.stage}" aria-label="Этап">${STAGES.map(([s, t]) => `<option value="${s}"${s === c.stage ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
    <td class="rate" aria-label="Оценка ${c.rating} из 5">${'★'.repeat(c.rating)}<s>${'★'.repeat(5 - c.rating)}</s></td>
    <td class="hide-m" style="white-space:nowrap">${fmtDate(c.created_at)}</td>
    <td><div class="row-act">${c.archived ? `<button class="ib" data-act="restore" title="Вернуть из архива">${ICON.res}</button>`
        : `<button class="ib" data-act="archive" title="В архив">${ICON.arc}</button>`}<button class="ib del" data-act="delete" title="Удалить">${ICON.del}</button></div></td></tr>`;
}

function render() {
  stats();
  const list = filtered();
  const shown = list.slice(0, S.limit);
  $('#rows').innerHTML = shown.length ? shown.map(row).join('')
    : `<tr><td colspan="9"><div class="empty"><div class="burst"><h3 class="comic">${S.all.length ? 'Никого <span class="r">не нашли</span>' : 'Пока <span class="r">пусто</span>'}</h3></div>
       <p class="muted">${S.all.length ? 'Попробуй убрать фильтры' : 'Покажи кандидатам QR-код со стенда — анкеты появятся здесь'}</p></div></td></tr>`;
  $('#more').hidden = list.length <= S.limit;
  $$('th button').forEach(b => { const [k, d] = S.sort.split(':'); b.innerHTML = b.textContent.replace(/ [↑↓]$/, '') + (b.dataset.sort === k ? ` <span class="dir">${d === 'desc' ? '↓' : '↑'}</span>` : ''); });
  const visible = new Set(list.map(c => c.id));
  for (const id of S.sel) if (!visible.has(id)) S.sel.delete(id);
  $('#all').checked = shown.length > 0 && shown.every(c => S.sel.has(c.id));
  $('#bulk').hidden = !S.sel.size;
  $('#selN').textContent = `Выбрано: ${S.sel.size}`;
  const arc = S.tab === 'archive'; $('#bArc').hidden = arc; $('#bRes').hidden = !arc;
  $('#csv').href = 'api/staff/export.csv' + (arc ? '?archived=1' : '');
}

let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(render, 150); });
['#fVac', '#fStage', '#fEvent', '#fSource'].forEach(s => $(s).addEventListener('change', render));
$('#sort').addEventListener('change', e => { S.sort = e.target.value; store.set('ochakovo.listView', { sort: S.sort }); render(); });
$$('th button').forEach(b => b.addEventListener('click', () => {
  const [k, d] = S.sort.split(':');
  S.sort = b.dataset.sort + ':' + (k === b.dataset.sort ? (d === 'asc' ? 'desc' : 'asc') : (['created_at', 'rating'].includes(b.dataset.sort) ? 'desc' : 'asc'));
  if ([...$('#sort').options].some(o => o.value === S.sort)) $('#sort').value = S.sort;
  store.set('ochakovo.listView', { sort: S.sort }); render();
}));
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  S.tab = b.dataset.tab; S.sel.clear(); S.limit = 100;
  $$('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); render();
}));
$('#more button').addEventListener('click', () => { S.limit += 100; render(); });
$('#all').addEventListener('change', e => { filtered().slice(0, S.limit).forEach(c => e.target.checked ? S.sel.add(c.id) : S.sel.delete(c.id)); render(); });
$('#bClear').addEventListener('click', () => { S.sel.clear(); render(); });

const byId = id => S.all.find(c => c.id === id);
async function patch(id, data, msg) {
  const c = byId(id); const before = { ...c };
  Object.assign(c, data); render(); if (!$('#drawer').hidden && openId === id) drawer(id);
  try { await api('PATCH', `/api/staff/candidates/${id}`, data); if (msg) toast(msg); }
  catch (e) { Object.assign(c, before); render(); toast(e.message); }
}
async function bulk(action, ids, extra = {}) {
  if (!ids.length) return;
  if (action === 'delete' && !await askConfirm(ids.length === 1 ? `Удалить «${byId(ids[0]).full_name}» навсегда? Вернуть будет нельзя — если кандидат просто неактуален, лучше перенести в архив.` : `Удалить ${ids.length} кандидатов навсегда? Вернуть будет нельзя.`)) return;
  try {
    await api('POST', '/api/staff/candidates/bulk', { ids, action, ...extra });
    const t = new Date().toISOString();
    if (action === 'delete') S.all = S.all.filter(c => !ids.includes(c.id));
    else for (const id of ids) { const c = byId(id); if (action === 'stage') c.stage = extra.stage; else { c.archived = action === 'archive' ? 1 : 0; c.archived_at = c.archived ? t : null; } }
    ids.forEach(id => S.sel.delete(id));
    if (ids.includes(openId) && action !== 'stage') closeDrawer();
    render();
    toast({ delete: 'Удалено', archive: 'Перенесено в архив', restore: 'Возвращено из архива', stage: 'Этап обновлён' }[action] + (ids.length > 1 ? `: ${ids.length}` : ''));
  } catch (e) { toast(e.message); }
}
$('#bulk').addEventListener('click', e => { const b = e.target.closest('[data-bulk]'); if (b) bulk(b.dataset.bulk, [...S.sel]); });
$('#bStage').addEventListener('change', e => { if (e.target.value) bulk('stage', [...S.sel], { stage: e.target.value }); e.target.value = ''; });

$('#rows').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return; const id = +tr.dataset.id;
  if (e.target.matches('td.c input')) { e.target.checked ? S.sel.add(id) : S.sel.delete(id); return render(); }
  const act = e.target.closest('[data-act]'); if (act) return bulk(act.dataset.act, [id]);
  const op = e.target.closest('[data-open]'); if (op) drawer(id, op.dataset.open === 'notes');
});
$('#rows').addEventListener('change', e => { if (e.target.matches('select.stage')) patch(+e.target.closest('tr').dataset.id, { stage: e.target.value }, 'Этап: ' + STAGE_RU[e.target.value]); });

// ---------- карточка кандидата ----------
let openId = null;
const dlRow = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
const fmtDay = iso => iso ? iso.split('-').reverse().join('.') : '';
async function drawer(id, toNotes = false) {
  const c = byId(id); if (!c) return; openId = id;
  const v = S.vacMap[c.vacancy_id];
  const box = $('#drawer section');
  $('#drawer').hidden = false; document.body.style.overflow = 'hidden';
  box.innerHTML = `<button class="ib x" data-close aria-label="Закрыть">✕</button>
    <p class="kicker">${c.source === 'self' ? 'Заполнил сам' : 'Внёс сотрудник' + (c.staff_name ? ': ' + esc(c.staff_name) : '')} · ${fmtDate(c.created_at)}</p>
    <h2 class="comic" id="dName">${esc(c.full_name)}</h2>
    <div class="row">${c.archived ? '<span class="tag">в архиве</span>' : ''}${c.dupes ? `<span class="tag dup">телефон есть ещё у ${c.dupes}</span>` : ''}</div>
    <dl>${dlRow('Вакансия', v?.title || 'не выбрана')}${dlRow('Телефон', c.phone)}${dlRow('Telegram', c.telegram)}${dlRow('E-mail', c.email)}
      ${dlRow('Возраст', c.age)}${dlRow('Кто', c.who)}${dlRow('Образование', c.edu_level)}${dlRow('Учится', c.still_studying ? 'да' + (c.grad_year ? ', выпуск ' + c.grad_year : '') : '')}${dlRow('Вуз / колледж', c.school)}${dlRow('Направление', c.specialty)}
      ${dlRow('Формат', c.employment)}${dlRow('Готов начать', fmtDay(c.start_date))}${dlRow('Смены', c.shifts)}${dlRow('Опыт', c.experience)}${dlRow('О себе', c.about)}${dlRow('Мероприятие', c.event)}${c.resume_url ? `<dt>Резюме</dt><dd><a href="${esc(c.resume_url)}" target="_blank" rel="noopener">${esc(c.resume_url)}</a></dd>` : ''}</dl>
    <div class="row">
      <a class="btn sm" href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">Позвонить</a>
      ${c.telegram ? `<a class="btn sm white" href="https://t.me/${esc(c.telegram.slice(1))}" target="_blank" rel="noopener">Telegram</a>` : ''}
      ${c.email ? `<a class="btn sm white" href="mailto:${esc(c.email)}">Письмо</a>` : ''}
    </div>
    <div class="box">
      <h3>Оценка HR</h3>
      <div class="row" style="justify-content:space-between">
        <div class="stars" id="dStars">${[1, 2, 3, 4, 5].map(i => `<button data-v="${i}" class="${i <= c.rating ? 'on' : ''}" aria-label="${i} из 5">★</button>`).join('')}</div>
        <select class="stage" data-s="${c.stage}" id="dStage">${STAGES.map(([s, t]) => `<option value="${s}"${s === c.stage ? ' selected' : ''}>${t}</option>`).join('')}</select>
      </div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="dHot" ${c.hot ? 'checked' : ''}><span>Горячий кандидат</span></label>
      <label class="field" style="margin-top:12px"><span>Следующий шаг</span><input id="dNext" value="${esc(c.next_step)}" maxlength="300" placeholder="Позвонить, пригласить на экскурсию…"></label>
    </div>
    <div class="box" id="dNotes">
      <h3>Комментарии</h3>
      <form id="noteForm" class="field"><textarea name="text" maxlength="4000" placeholder="Например: созвонились, ждёт приглашения на собеседование" required></textarea>
        <button class="btn sm" style="align-self:flex-start">Добавить</button></form>
      <div id="notes"><p class="muted">Загружаем…</p></div>
    </div>
    <div class="row" style="margin-top:22px">
      ${c.archived ? `<button class="btn white sm" data-dact="restore">Вернуть из архива</button>` : `<button class="btn white sm" data-dact="archive">В архив</button>`}
      <button class="btn sm" data-dact="delete">Удалить</button>
    </div>`;
  $('#dStars').addEventListener('click', e => { const b = e.target.closest('button'); if (b) patch(id, { rating: c.rating === +b.dataset.v ? 0 : +b.dataset.v }); });
  $('#dStage').addEventListener('change', e => patch(id, { stage: e.target.value }, 'Этап: ' + STAGE_RU[e.target.value]));
  $('#dHot').addEventListener('change', e => patch(id, { hot: e.target.checked }));
  $('#dNext').addEventListener('change', e => patch(id, { next_step: e.target.value }, 'Сохранено'));
  box.querySelectorAll('[data-dact]').forEach(b => b.addEventListener('click', () => bulk(b.dataset.dact, [id])));
  $('#noteForm').addEventListener('submit', async e => {
    e.preventDefault(); const text = e.target.text.value.trim(); if (!text) return;
    try { await api('POST', `/api/staff/candidates/${id}/notes`, { text, author: store.get('ochakovo.staff', '') }); c.notes_count++; e.target.reset(); loadNotes(id); render(); }
    catch (err) { toast(err.message); }
  });
  loadNotes(id);
  if (toNotes) requestAnimationFrame(() => { $('#dNotes').scrollIntoView({ block: 'start' }); $('#noteForm textarea').focus({ preventScroll: true }); });
}
async function loadNotes(id) {
  const c = byId(id);
  const notes = await api('GET', `/api/staff/candidates/${id}/notes`).catch(() => []);
  if (openId !== id) return;
  const legacy = c.comment && !notes.some(n => n.text === c.comment) ? [{ text: c.comment, author: c.staff_name, created_at: c.created_at }] : [];
  const all = [...notes, ...legacy];
  $('#notes').innerHTML = all.length ? all.map(n => `<div class="note">${esc(n.text)}<small>${esc(n.author || 'HR')} · ${fmtDate(n.created_at)}</small></div>`).join('') : '<p class="muted">Комментариев пока нет</p>';
}
function closeDrawer() { $('#drawer').hidden = true; openId = null; document.body.style.overflow = ''; }
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer' || e.target.closest('[data-close]')) closeDrawer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('.ask')) { closeDrawer(); closeModal(); } });

// ---------- модальные окна: QR и вакансии ----------
function openModal(html) { const m = $('#modal'); m.querySelector('section').innerHTML = `<button class="ib x" data-close aria-label="Закрыть">✕</button>` + html; m.hidden = false; }
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });

$('#qrBtn').addEventListener('click', () => {
  openModal(`<p class="kicker">Для стенда</p><h2 class="comic" style="font-size:28px">QR <span class="r">на анкету</span></h2>
    <p class="muted">Распечатай или покажи с планшета — анкета откроется с уже подставленным мероприятием и вакансией.</p>
    <div class="grid">
      <label class="field wide"><span>Мероприятие</span><input id="qEv" value="${esc(store.get('ochakovo.event', ''))}" placeholder="Ярмарка вакансий МГУПП"></label>
      <label class="field"><span>Вакансия</span><select id="qVac"><option value="">Выбор кандидата</option>${S.vacs.filter(v => v.active).map(v => `<option value="${esc(v.id)}">${esc(v.title)}</option>`).join('')}</select></label>
      <label class="check" style="align-self:end"><input type="checkbox" id="qKiosk"><span>Режим планшета на стенде</span></label>
    </div>
    <div id="qr"></div><p class="qrlink"><a id="qLink" target="_blank" rel="noopener"></a></p>
    <button class="btn white sm" type="button" onclick="window.print()">Распечатать</button>`);
  const upd = () => {
    const u = new URL(LINK.form, location.href); u.search = '';
    const ev = $('#qEv').value.trim(); if (ev) u.searchParams.set('e', ev);
    if ($('#qVac').value) u.searchParams.set('v', $('#qVac').value);
    if ($('#qKiosk').checked) u.searchParams.set('kiosk', '1');
    $('#qLink').href = $('#qLink').textContent = u.href;
    $('#qr').innerHTML = '';
    const qr = qrcode(0, 'M'); qr.addData(u.href); qr.make();
    $('#qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: false });
  };
  ['#qEv', '#qVac', '#qKiosk'].forEach(s => $(s).addEventListener('input', upd)); upd();
});

$('#vacBtn').addEventListener('click', function vacModal() {
  openModal(`<p class="kicker">Что показываем кандидатам</p><h2 class="comic" style="font-size:28px">Вакансии</h2>
    <div class="vlist">${S.vacs.map(v => `<label><input type="checkbox" data-vid="${esc(v.id)}" ${v.active ? 'checked' : ''}>${esc(v.title)}<span class="muted" style="margin-left:auto;font-weight:600;font-size:13px">${esc(v.pay)}</span></label>`).join('')}</div>
    <form id="vacForm" class="grid" style="margin-top:18px">
      <label class="field wide"><span>Новая вакансия</span><input name="title" required maxlength="120" placeholder="Например: Инженер-механик"></label>
      <label class="field"><span>Отдел</span><input name="dept" maxlength="80"></label>
      <label class="field"><span>Зарплата</span><input name="pay" maxlength="80" placeholder="от 70 000 ₽"></label>
      <button class="btn sm" style="justify-self:start">Добавить</button>
    </form>`);
  $$('.vlist input').forEach(i => i.addEventListener('change', async () => {
    try { await api('PATCH', `/api/staff/vacancies/${i.dataset.vid}`, { active: i.checked }); S.vacMap[i.dataset.vid].active = i.checked ? 1 : 0; toast(i.checked ? 'Вакансия показана' : 'Вакансия скрыта из анкеты'); }
    catch (e) { i.checked = !i.checked; toast(e.message); }
  }));
  $('#vacForm').addEventListener('submit', async e => {
    e.preventDefault(); const d = formData(e.target);
    try { await api('POST', '/api/staff/vacancies', d); await load(); vacModal(); toast('Вакансия добавлена'); } catch (err) { toast(err.message); }
  });
});
</script>
</body>
</html>
